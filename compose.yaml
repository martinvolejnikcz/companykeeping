services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      COMPANYKEEPING_DB_PASSWORD: ${COMPANYKEEPING_DB_PASSWORD:?Set COMPANYKEEPING_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-companykeeping.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "companykeeping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/companykeeping
      SPRING_DATASOURCE_USERNAME: companykeeping
      SPRING_DATASOURCE_PASSWORD: ${COMPANYKEEPING_DB_PASSWORD:?Set COMPANYKEEPING_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${COMPANYKEEPING_PORT:-4317}:4317"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
