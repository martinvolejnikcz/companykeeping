apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trainer-archive-postgres-from-companykeeping
  namespace: trainer-archive
spec:
  podSelector:
    matchLabels:
      app: trainer-archive-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: companykeeping
          podSelector:
            matchLabels:
              app.kubernetes.io/name: companykeeping
              app.kubernetes.io/instance: companykeeping
      ports:
        - protocol: TCP
          port: 5432
